name: CI

# Build the generator and verify every bundled example compiles, on every push
# to main and on PRs. Does NOT release — releases happen on tag (see release.yml).

on:
  push:
    branches: [main]
  pull_request:

# Pinned Sky compiler image. A new Sky tag must not silently change what CI
# builds. Move the tag and the digest together to change Sky release.
env:
  SKY_IMAGE: anzel/sky:0.27.19@sha256:c8697e6decc479284d3b76545585f88f53f865512ac664bba3452cf0ca7c33cc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + verify examples (Sky compiler docker image)
        run: |
          docker run --rm -e GOFLAGS=-buildvcs=false \
            -v "$PWD:/app" -w /app --entrypoint bash "$SKY_IMAGE" -c '
            set -euo pipefail
            sky build src/Main.sky
            for cfg in sky*.toml; do
              echo "== $cfg =="
              ./sky-out/app --config "$cfg"   # regenerates + runs sky check on output (verify=true)
            done
          '
